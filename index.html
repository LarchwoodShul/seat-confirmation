<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Permanent Seating Confirmation</title>
    <style>
        body{ font-family: 'Segoe UI', Arial, sans-serif; background:#f4f7f6; padding:20px; color: #333; }
        .container{ max-width:750px; margin:auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        h2{ margin-top:0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .step{ display:none; }
        .step.active{ display:block; }
        table{ width:100%; border-collapse:collapse; margin:20px 0; font-size: 14px; }
        th,td{ border:1px solid #dfe6e9; padding:12px; text-align: left; }
        th { background: #f8f9fa; }
        input, textarea{ width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box; margin-top:5px; margin-bottom:10px; }
        button{ margin-top:20px; padding:15px; width:100%; font-size:16px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; }
        .summary-box{ background: #eef7ff; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 5px solid #007bff; }
        .summary-box ul { margin: 5px 0; padding-left: 20px; }
        .pdf-link { display: block; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; text-align: center; color: #856404; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
        canvas{ border:2px dashed #ccc; width:100%; height:150px; background: #fafafa; cursor: crosshair; }
        .checkbox-label { display: block; margin-bottom: 12px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="step active">
        <h2>1. Review Seating</h2>
        <p><strong>Member:</strong> <span id="memberName"></span></p>
        <table id="seatTable">
            <thead><tr><th>Section</th><th>Occupant</th><th>Age</th><th>Row</th><th>Price</th></tr></thead>
            <tbody></tbody>
        </table>
        <div class="summary-box">
            <p><strong>Total Amount:</strong> $<span id="total">0</span></p>
            <p><strong>25% Deposit Due:</strong> $<span id="deposit">0</span></p>
        </div>
        <button onclick="nextStep(2)">Continue to Payment</button>
    </div>

    <div id="step2" class="step">
        <h2>2. Payment Options</h2>
        
        <div class="summary-box">
            <ul>
                <li>25% deposit required</li>
                <li>Balance due within 24 months</li>
                <li>Deposit deadline (14 days)</li>
            </ul>
        </div>

        <div class="radio-group">
            <label><input type="radio" name="payment" value="Pay in Full"> Pay in Full</label><br>
            <label><input type="radio" name="payment" value="Monthly Installments"> Monthly Installments</label><br>
            <label><input type="radio" name="payment" value="Quarterly Installments"> Quarterly Installments</label><br>
            <label><input type="radio" name="payment" value="Other"> Other</label>
        </div>

        <div style="margin-top:20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
            <label>Credit Card Number</label>
            <input type="text" id="ccNum" placeholder="0000 0000 0000 0000">
            <label>Expiration (MM/YY)</label>
            <input type="text" id="ccExp" placeholder="MM/YY">
        </div>

        <label style="margin-top:15px; display:block;">Additional Payment Instructions</label>
        <textarea id="notes" rows="3" placeholder="Enter any specific details here..."></textarea>
        
        <button onclick="nextStep(3)">Continue to Agreement</button>
    </div>

    <div id="step3" class="step">
        <h2>3. Final Agreement</h2>
        
        <a href="YOUR_PDF_LINK_HERE" target="_blank" class="pdf-link">
            📄 Click here to open the Permanent Seating Agreement (PDF)
        </a>

        <label class="checkbox-label">
            <input type="checkbox" id="agree1"> I have read and agree to the Permanent Seating Agreement.
        </label>
        
        <label class="checkbox-label">
            <input type="checkbox" id="agree2"> I understand that seat locations will be finalized after confirmations and deposits are received.
        </label>
        
        <p style="margin-top:20px; font-weight:bold;">Signature:</p>
        <canvas id="signaturePad"></canvas>
        <button type="button" style="background:#6c757d; padding:5px; font-size:11px; width:auto; margin-top:5px;" onclick="clearSignature()">Clear Signature</button>

        <button id="submitBtn" onclick="submitForm()">Submit Confirmation</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQg0Md8MCI_IFtpMlLAnQ_-YAA1iRqpHJHDE8-P7lCC7JGCw7LzUfjzUQK0-ZuIjAQDg/exec";
    let seats = [];
    let totalAmount = 0;

    function loadData() {
        const params = new URLSearchParams(window.location.search);
        document.getElementById("memberName").innerText = params.get("member") || "N/A";
        
        const seatString = params.get("seats");
        if (seatString) {
            seatString.split(",").forEach(s => {
                const [sec, name, age, row, price] = s.split("|");
                const p = parseFloat(price) || 0;
                seats.push({ sec, name, age, row, price: p });
                totalAmount += p;
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${sec}</td><td><input class="sn" value="${name}"></td><td><input class="sa" type="number" value="${age}"></td><td>${row}</td><td>$${p}</td>`;
                document.querySelector("#seatTable tbody").appendChild(tr);
            });
        }
        document.getElementById("total").innerText = totalAmount.toFixed(2);
        document.getElementById("deposit").innerText = (totalAmount * 0.25).toFixed(2);
    }

    function nextStep(s) {
        document.querySelectorAll(".step").forEach(div => div.classList.remove("active"));
        document.getElementById("step" + s).classList.add("active");
        if(s === 3) resizeCanvas();
    }

    const canvas = document.getElementById("signaturePad");
    const ctx = canvas.getContext("2d");
    let drawing = false;

    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }

    canvas.addEventListener("mousedown", () => drawing = true);
    window.addEventListener("mouseup", () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener("mousemove", (e) => {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 2;
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
    });

    function clearSignature() { ctx.clearRect(0,0,canvas.width,canvas.height); }

    async function submitForm() {
        const payOption = document.querySelector('input[name="payment"]:checked');
        if (!payOption) return alert("Please select a payment option");
        if (!document.getElementById("agree1").checked || !document.getElementById("agree2").checked) 
            return alert("Please check both agreement boxes");

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerText = "Submitting...";

        const payload = {
            member: document.getElementById("memberName").innerText,
            seats: seats,
            total: totalAmount,
            paymentPlan: payOption.value,
            cardNumber: document.getElementById("ccNum").value,
            cardExpiry: document.getElementById("ccExp").value,
            notes: document.getElementById("notes").value,
            signature: canvas.toDataURL(),
            submissionId: Date.now()
        };

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            alert("Confirmation submitted successfully!");
            window.location.reload();
        } catch (e) {
            alert("Error submitting. Please try again.");
            btn.disabled = false;
            btn.innerText = "Submit Confirmation";
        }
    }
    loadData();
</script>
</body>
</html>
