<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Permanent Seating Confirmation</title>
    <style>
        body{ font-family: 'Segoe UI', Arial, sans-serif; background:#f4f7f6; padding:20px; color: #333; }
        .container{ max-width:750px; margin:auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        h2{ margin-top:0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .step{ display:none; }
        .step.active{ display:block; }
        table{ width:100%; border-collapse:collapse; margin:20px 0; font-size: 14px; }
        th,td{ border:1px solid #dfe6e9; padding:12px; text-align: left; }
        th { background: #f8f9fa; }
        input, textarea{ width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; box-sizing: border-box; margin-top:5px; margin-bottom:10px; }
        .cc-flex { display: flex; gap: 10px; }
        .cc-flex div { flex: 1; }
        button{ margin-top:20px; padding:15px; width:100%; font-size:16px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; }
        .summary{ background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top:20px; border-left: 5px solid #007bff; }
        .pdf-link { display: block; padding: 20px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; text-align: center; color: #856404; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        canvas{ border:2px dashed #ccc; width:100%; height:150px; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="step active">
        <h2>1. Review Seating</h2>
        <p><strong>Member:</strong> <span id="memberName"></span></p>
        <p><strong>Offer:</strong> <span id="offerType"></span></p>
        <table id="seatTable">
            <thead><tr><th>Section</th><th>Occupant</th><th>Age</th><th>Row</th><th>Price</th></tr></thead>
            <tbody></tbody>
        </table>
        <div class="summary">
            <p>Total: $<span id="total">0</span></p>
            <p>25% Deposit: $<span id="deposit">0</span></p>
        </div>
        <button onclick="nextStep(2)">Continue to Payment</button>
    </div>

    <div id="step2" class="step">
        <h2>2. Payment Information</h2>
        <div class="radio-group">
            <label><input type="radio" name="payment" value="Full"> Pay in Full</label><br>
            <label><input type="radio" name="payment" value="Installments"> Installments</label>
        </div>

        <div style="margin-top:20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
            <label>Credit Card Number</label>
            <input type="text" id="ccNum" placeholder="0000 0000 0000 0000">
            <div class="cc-flex">
                <div>
                    <label>Expiration (MM/YY)</label>
                    <input type="text" id="ccExp" placeholder="MM/YY">
                </div>
                <div>
                    <label>CVV</label>
                    <input type="text" placeholder="***">
                </div>
            </div>
        </div>

        <label>Notes:</label>
        <textarea id="notes" rows="2"></textarea>
        <button onclick="nextStep(3)">Continue to Terms</button>
    </div>

    <div id="step3" class="step">
        <h2>3. Terms & Signature</h2>
        
        <a href="YOUR_PDF_URL_HERE" target="_blank" class="pdf-link">
            📄 Click here to open the Permanent Seating Agreement (PDF)
        </a>

        <label><input type="checkbox" id="agree1"> I have read the PDF agreement linked above</label><br>
        <label><input type="checkbox" id="agree2"> I authorize the deposit on the card provided</label>
        
        <p style="margin-top:20px;">Signature:</p>
        <canvas id="signaturePad"></canvas>
        <button type="button" style="background:#6c757d; padding:5px; font-size:12px; width:auto;" onclick="clearSignature()">Clear</button>

        <button id="submitBtn" onclick="submitForm()">Submit Confirmation</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuM2oveKkvx66BfaurrAEaQy-2hXkb5_oJlyiAkPLbdxUhb-Z8Tu3EvZiTgd8qsYJzqw/exec";
    let seats = [];
    let totalAmount = 0;

    function loadData() {
        const params = new URLSearchParams(window.location.search);
        document.getElementById("memberName").innerText = params.get("member") || "";
        document.getElementById("offerType").innerText = params.get("offer") || "";
        const seatString = params.get("seats");
        if (seatString) {
            seatString.split(",").forEach(s => {
                const [sec, name, age, row, price] = s.split("|");
                const p = parseFloat(price) || 0;
                seats.push({ sec, name, age, row, price: p });
                totalAmount += p;
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${sec}</td><td><input class="sn" value="${name}"></td><td><input class="sa" type="number" value="${age}"></td><td>${row}</td><td>$${p}</td>`;
                document.querySelector("#seatTable tbody").appendChild(tr);
            });
        }
        document.getElementById("total").innerText = totalAmount.toFixed(2);
        document.getElementById("deposit").innerText = (totalAmount * 0.25).toFixed(2);
    }

    function nextStep(s) {
        document.querySelectorAll(".step").forEach(div => div.classList.remove("active"));
        document.getElementById("step" + s).classList.add("active");
        if(s === 3) {
            const canvas = document.getElementById("signaturePad");
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
    }

    // Signature Logic
    const canvas = document.getElementById("signaturePad");
    const ctx = canvas.getContext("2d");
    let drawing = false;
    canvas.addEventListener("mousedown", () => drawing = true);
    window.addEventListener("mouseup", () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener("mousemove", (e) => {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
    });
    function clearSignature() { ctx.clearRect(0,0,canvas.width,canvas.height); }

    async function submitForm() {
        if (!document.getElementById("agree1").checked) return alert("Please read the agreement");
        
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerText = "Processing...";

        const payload = {
            member: document.getElementById("memberName").innerText,
            offer: document.getElementById("offerType").innerText,
            seats: seats, 
            total: totalAmount,
            paymentPlan: document.querySelector('input[name="payment"]:checked')?.value,
            cardNumber: document.getElementById("ccNum").value, // NEW
            cardExpiry: document.getElementById("ccExp").value, // NEW
            notes: document.getElementById("notes").value,
            signature: canvas.toDataURL(),
            submissionId: Date.now()
        };

        await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
        });

        alert("Submitted successfully!");
        window.location.reload();
    }
    loadData();
</script>
</body>
</html>
