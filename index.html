<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Seat Confirmation</title>

<style>

body{
font-family:Arial;
padding:40px;
background:#f4f4f4;
}

.container{
background:white;
padding:30px;
border-radius:8px;
max-width:800px;
margin:auto;
}

input,textarea{
width:100%;
padding:10px;
margin-bottom:15px;
}

button{
padding:12px 20px;
font-size:16px;
cursor:pointer;
}

canvas{
border:1px solid black;
width:100%;
height:200px;
}

</style>

</head>

<body>

<div class="container">

<h2>Seat Confirmation</h2>

<label>Member</label>
<input id="member">

<label>Offer</label>
<input id="offer">

<label>Name</label>
<input id="name">

<label>Age</label>
<input id="age">

<label>Section</label>
<input id="section">

<label>Row</label>
<input id="row">

<label>Price</label>
<input id="price">

<label>Total</label>
<input id="total">

<label>Deposit</label>
<input id="deposit">

<label>Balance</label>
<input id="balance">

<label>Payment Plan</label>
<input id="paymentPlan">

<label>Notes</label>
<textarea id="notes"></textarea>

<h3>Signature</h3>

<canvas id="signature"></canvas>

<br><br>

<button onclick="clearSignature()">Clear Signature</button>

<br><br>

<button onclick="submitForm()">Submit</button>

</div>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbypXjnD3QWc2S0KPIOt9BYbyfesWFIVnGiGxawznpllKWEPanWm6Wv2KSdPdfTZ0E0CDw/exec";

const canvas=document.getElementById("signature");
const ctx=canvas.getContext("2d");

canvas.width=canvas.offsetWidth;
canvas.height=200;

let drawing=false;

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mouseup",stop);
canvas.addEventListener("mousemove",draw);

canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchend",stop);
canvas.addEventListener("touchmove",draw);

function getPosition(e){

const rect=canvas.getBoundingClientRect();

if(e.touches){

return{
x:e.touches[0].clientX-rect.left,
y:e.touches[0].clientY-rect.top
}

}else{

return{
x:e.clientX-rect.left,
y:e.clientY-rect.top
}

}

}

function start(e){

drawing=true;

const pos=getPosition(e);

ctx.beginPath();
ctx.moveTo(pos.x,pos.y);

}

function draw(e){

if(!drawing) return;

e.preventDefault();

const pos=getPosition(e);

ctx.lineWidth=2;
ctx.lineCap="round";

ctx.lineTo(pos.x,pos.y);
ctx.stroke();

}

function stop(){

drawing=false;

}

function clearSignature(){

ctx.clearRect(0,0,canvas.width,canvas.height);

}

async function submitForm(){

const signature=canvas.toDataURL();

const payload={

submissionId:Date.now(),

member:document.getElementById("member").value,

offer:document.getElementById("offer").value,

total:document.getElementById("total").value,

deposit:document.getElementById("deposit").value,

balance:document.getElementById("balance").value,

paymentPlan:document.getElementById("paymentPlan").value,

notes:document.getElementById("notes").value,

signature:signature,

date:new Date(),

seats:[
{
section:document.getElementById("section").value,
name:document.getElementById("name").value,
age:document.getElementById("age").value,
row:document.getElementById("row").value,
price:document.getElementById("price").value
}
]

};

try{

const res=await fetch(SCRIPT_URL,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify(payload)
});

const text=await res.text();

alert(text);

}catch(err){

alert("Error: "+err);

}

}

</script>

</body>
</html>
